[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (may need running services)
    api: HTTP API tests (requires API on :8000)
    slow: Slow tests (>1s)
    gateway: Gateway switch tests
    e2e: End-to-end (requires all services)

addopts = -v --tb=short --strict-markers -p no:warnings
