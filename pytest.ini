[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Fast health + core page checks
    unit: Unit tests (no external dependencies)
    integration: Integration tests (may need running services)
    api: HTTP API tests (requires API on :8000)
    slow: Slow tests (>1s)
    gateway: Gateway switch tests
    e2e: End-to-end (requires all services)
    asyncio: pytest-asyncio marker (async tests, asyncio_mode=auto)

addopts = -v --tb=short --strict-markers -p no:warnings -m "not slow"
faulthandler_timeout = 180
asyncio_default_fixture_loop_scope = function
asyncio_mode = auto
