# Mood Profile Vectors — soft-coded, extensible via BGE cosine.
# 
# Each category has descriptors that encode the "vibe" of that mood.
# NOT keyword lists. These are used to build a BGE embedding vector.
# Classification: BGE(text) → cosine nearest-neighbor → mood category.
#
# Add new categories by appending entries — no code change needed.

profiles:
  solution_seeking:
    z_value: 1.0
    descriptors:
      - "give me the exact answer, I need facts"
      - "confirm whether this is correct or not"
      - "provide the specific value, number, or address"
      - "yes or no question expecting definitive answer"
      - "what is the exact result of this operation"
      - "show me the data directly without interpretation"

  exploration:
    z_value: 0.0
    descriptors:
      - "I want to understand the reasoning behind this"
      - "what are possible approaches or strategies"
      - "help me think through this problem step by step"
      - "how would you analyze this situation"
      - "what factors should I consider when deciding"
      - "can you explain the underlying mechanism"
      - "I'm curious about different perspectives on this"

  mirror_emotional:
    z_value: -1.0
    descriptors:
      - "I'm frustrated and need to vent"
      - "this is too hard, I feel overwhelmed"
      - "I just need someone to listen to me"
      - "expressing emotional distress, not seeking solutions"
      - "sharing a personal struggle, wanting empathy"
      - "I feel defeated and need encouragement"

  neutral:
    z_value: 0.0
    descriptors:
      - "routine task execution"
      - "general information exchange"
      - "simple greeting or acknowledgment"
