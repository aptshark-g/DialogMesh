# DialogMesh Docker Compose
# Usage: docker-compose up --build

version: "3.8"

services:
  dialogmesh:
    build: .
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - LM_STUDIO_URL=http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m pytest tests/test_pcr_v2_dedicated.py tests/test_topic_tree.py tests/test_integration.py -v
