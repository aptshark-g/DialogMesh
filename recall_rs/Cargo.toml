[package]
name = "dialogmesh-recall"
version = "0.1.0"
edition = "2021"

[lib]
name = "dialogmesh_recall"
crate-type = ["cdylib"]

[dependencies]
# abi3-py311: pyo3 buffer 模块在 abi3+Py<3.11 被禁用（2026-08-11 实测）;
# py311 覆盖 3.11~3.13（.venv 3.13 主环境, anaconda 3.9 测试环境放弃）
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
rayon = "1.10"

[profile.release]
lto = true
codegen-units = 1
